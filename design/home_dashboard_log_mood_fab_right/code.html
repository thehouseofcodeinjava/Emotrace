<div class="bg-surface-container-low rounded-lg p-6 flex items-center justify-between shadow-sm relative overflow-hidden group">

</div>
<div class="z-10 bg-surface-container-highest w-12 h-12 rounded-full flex items-center justify-center text-2xl">
                    🔥

<div class="absolute -right-4 -top-4 w-24 h-24 bg-primary/5 rounded-full blur-3xl group-hover:bg-primary/10 transition-colors"></div>
</div>
</section>

</div>
</div>

</div>
</div>

</div>
</div>

</div>
