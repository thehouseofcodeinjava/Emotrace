<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EMOTRACE - Mood Entry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#47f3bb",
                        "surface-container-lowest": "#0e0e0e",
                        "outline-variant": "#3b4a43",
                        "surface-tint": "#27e0a9",
                        "inverse-surface": "#e5e2e1",
                        "on-secondary-container": "#572900",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#ffdad8",
                        "on-secondary": "#502500",
                        "inverse-on-surface": "#313030",
                        "tertiary": "#ffcdcb",
                        "on-error-container": "#ffdad6",
                        "on-surface": "#e5e2e1",
                        "on-tertiary": "#680011",
                        "inverse-primary": "#006c4f",
                        "surface-bright": "#393939",
                        "on-primary-fixed": "#002116",
                        "on-primary-fixed-variant": "#00513b",
                        "on-secondary-fixed-variant": "#713700",
                        "primary-fixed": "#54fdc4",
                        "secondary-fixed": "#ffdcc6",
                        "surface-container-low": "#1c1b1b",
                        "on-primary": "#003827",
                        "on-primary-container": "#00573f",
                        "surface-variant": "#353534",
                        "surface-container": "#201f1f",
                        "tertiary-container": "#ffa5a3",
                        "surface-container-highest": "#353534",
                        "surface-container-high": "#2a2a2a",
                        "on-secondary-fixed": "#301400",
                        "secondary": "#ffb784",
                        "surface-dim": "#131313",
                        "secondary-container": "#f47d00",
                        "primary-fixed-dim": "#27e0a9",
                        "on-tertiary-container": "#9d001f",
                        "surface": "#131313",
                        "background": "#131313",
                        "on-tertiary-fixed": "#410007",
                        "on-background": "#e5e2e1",
                        "primary-container": "#06d6a0",
                        "on-surface-variant": "#bacac1",
                        "tertiary-fixed-dim": "#ffb3b1",
                        "secondary-fixed-dim": "#ffb784",
                        "outline": "#85948c",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 0px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#131313]/70 backdrop-blur-xl flex justify-between items-center px-6 h-16 w-full shadow-[0_32px_64px_-15px_rgba(39,224,169,0.06)]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#47F3BB] hover:opacity-80 transition-opacity active:scale-95 duration-200 ease-in-out cursor-pointer">menu</span>
</div>
<h1 class="text-2xl font-black text-[#06D6A0] tracking-tighter font-headline">EMOTRACE</h1>
<div class="h-8 w-8 rounded-full bg-surface-container-high border-2 border-primary/20 flex items-center justify-center overflow-hidden">
<img class="h-full w-full object-cover" data-alt="Close up portrait of a young woman with a calm expression, soft cinematic lighting, dark studio background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUMW76GfrH57zh68Ixm5Xvz5rEWBKuoUmRjC1cm_xU1xtFvvKskNKeOY0pnj5nSYPWHJcIZs98ZYBHIzBL7r6Z_m4jYjPfxwOqx2gQE6GWouTjU8NoeSRmOsntbmUHnREpYovaDkW69Lk-UpVMg1gusWQIx22QXqSnhMmgWyWP6R-13Jzbn6EWv2vxKu1wRHDlM4gpEaHjPhC3gbuer4Eimhgx5BjZZDYqQ8_0YZRmjqdguAwQTfi8pc4TETGjAxzKPVAXjZBYE_dN"/>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto min-h-screen">
<!-- Header Section -->
<section class="mb-12 relative">
<div class="absolute -top-10 -left-10 w-40 h-40 bg-primary/5 rounded-full blur-3xl"></div>
<p class="font-label text-xs uppercase tracking-widest text-primary mb-2">Daily Check-in</p>
<h2 class="font-headline text-4xl font-extrabold tracking-tight mb-2">How are you feeling?</h2>
<p class="text-on-surface-variant font-body">It takes 30 seconds</p>
</section>
<!-- Mood Scale - Editorial Column Pattern -->
<section class="mb-16 flex gap-8 items-start">
<div class="flex-1">
<div class="bg-surface-container-low rounded-lg p-8 relative overflow-hidden">
<!-- Background Glow for selected state 7 -->
<div class="absolute inset-0 bg-gradient-to-t from-red-500/5 via-[#47F3BB]/10 to-green-500/5 pointer-events-none"></div>
<div class="flex flex-col gap-4 relative z-10">
<!-- Mood Scale Items -->
<div class="flex flex-col items-center gap-6 py-4">
<!-- Higher Numbers (Better Mood) -->
<div class="flex items-center justify-between w-full opacity-40">
<span class="text-sm font-label">10</span>
<span class="text-4xl">🌟</span>
</div>
<div class="flex items-center justify-between w-full opacity-40">
<span class="text-sm font-label">9</span>
<span class="text-3xl">😊</span>
</div>
<div class="flex items-center justify-between w-full opacity-40">
<span class="text-sm font-label">8</span>
<span class="text-3xl">🙂</span>
</div>
<!-- SELECTED STATE (7) -->
<div class="flex items-center justify-between w-full bg-surface-container-highest rounded-full p-4 ring-2 ring-primary/30 shadow-[0_0_30px_rgba(71,243,187,0.15)] relative scale-110">
<div class="absolute -left-12 top-1/2 -translate-y-1/2">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
<span class="text-on-primary font-bold text-sm">7</span>
</div>
</div>
<span class="text-sm font-bold text-primary ml-2 uppercase tracking-tighter">Selected</span>
<span class="text-5xl drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">✨</span>
</div>
<div class="flex items-center justify-between w-full opacity-40">
<span class="text-sm font-label">6</span>
<span class="text-3xl">😐</span>
</div>
<div class="flex items-center justify-between w-full opacity-40">
<span class="text-sm font-label">5</span>
<span class="text-3xl">😕</span>
</div>
<!-- Lower Numbers (Worse Mood) -->
<div class="flex items-center justify-between w-full opacity-20">
<span class="text-sm font-label">1</span>
<span class="text-3xl">😢</span>
</div>
</div>
</div>
</div>
</div>
<!-- Motivational Sidebar -->
<div class="hidden md:flex flex-col justify-center items-center w-32 pt-20">
<div class="text-center">
<p class="font-headline font-bold text-primary-container leading-tight rotate-90 origin-center whitespace-nowrap text-3xl">You're doing great!</p>
</div>
</div>
</section>
<!-- Mobile Motivational Message -->
<div class="md:hidden mb-8 text-center">
<p class="font-headline font-bold text-primary-container text-xl italic">"You're doing great!"</p>
</div>
<!-- Emotion Tags - Bento Grid Inspired -->
<section class="mb-12">
<h3 class="font-label text-xs uppercase tracking-widest text-on-surface-variant mb-6">Describe your feelings</h3>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-high px-4 py-3 rounded-xl text-sm font-medium transition-all text-left">Anxious</button>
<button class="bg-primary/20 text-primary px-4 py-3 rounded-xl text-sm font-bold transition-all text-left flex items-center justify-between border border-primary/20">
                    Calm
                    <span class="material-symbols-outlined text-sm">check_circle</span>
</button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-high px-4 py-3 rounded-xl text-sm font-medium transition-all text-left">Stressed</button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-high px-4 py-3 rounded-xl text-sm font-medium transition-all text-left">Happy</button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-high px-4 py-3 rounded-xl text-sm font-medium transition-all text-left">Sad</button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-high px-4 py-3 rounded-xl text-sm font-medium transition-all text-left">Grateful</button>
<button class="bg-surface-container-low text-on-surface hover:bg-surface-container-high px-4 py-3 rounded-xl text-sm font-medium transition-all text-left">Overwhelmed</button>
<button class="bg-primary/20 text-primary px-4 py-3 rounded-xl text-sm font-bold transition-all text-left flex items-center justify-between border border-primary/20">
                    Focused
                    <span class="material-symbols-outlined text-sm">check_circle</span>
</button>
</div>
</section>
<!-- Optional Notes -->
<section class="mb-12">
<div class="flex justify-between items-center mb-4">
<h3 class="font-label text-xs uppercase tracking-widest text-on-surface-variant">Reflection Notes</h3>
<span class="text-[10px] font-label text-on-surface-variant bg-surface-container-high px-2 py-1 rounded">0/500</span>
</div>
<textarea class="w-full bg-surface-container-low border-none rounded-lg p-6 font-body text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/20 transition-all min-h-[160px] resize-none" placeholder="What happened? Why do you feel this way?"></textarea>
</section>
<!-- CTA Action -->
<section class="mt-8 mb-20">
<button class="w-full h-16 rounded-xl bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg shadow-[0_12px_40px_-10px_rgba(71,243,187,0.4)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">save</span>
                Save Mood Entry
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-4 left-0 w-full z-50 flex justify-around items-center px-6">
<div class="flex justify-around items-center w-full max-w-md bg-[#131313]/70 backdrop-blur-xl rounded-full h-20 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-[#353534] text-[#47F3BB] rounded-full px-6 py-2 transition-all duration-300" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-inter text-[10px] font-medium tracking-[0.05em] uppercase mt-1">Home</span>
</a>
<!-- Calendar -->
<a class="flex flex-col items-center justify-center text-[#E5E2E1] opacity-60 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-inter text-[10px] font-medium tracking-[0.05em] uppercase mt-1">Calendar</span>
</a>
<!-- Insights -->
<a class="flex flex-col items-center justify-center text-[#E5E2E1] opacity-60 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">analytics</span>
<span class="font-inter text-[10px] font-medium tracking-[0.05em] uppercase mt-1">Insights</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-[#E5E2E1] opacity-60 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-inter text-[10px] font-medium tracking-[0.05em] uppercase mt-1">Settings</span>
</a>
</div>
</nav>
</body></html>
